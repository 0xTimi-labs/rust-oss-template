name: Security

# 可复用安全门禁：由 ci.yml 通过 workflow_call 编排调用，
# 触发时机（PR / push main / merge queue / 周一定时）由 CI workflow 统一管理。

on:
  workflow_call:
    secrets:
      GITLEAKS_LICENSE:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 密钥泄露扫描：内容原子性检查（组合提交不产生新泄露），merge_group 跳过，
  # 由合并后 push main 全量扫描兜底；fork PR 无 secrets，改用官方开源 CLI 容器（免 license）
  gitleaks:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 全量历史才能扫出已提交过的密钥
      - name: fork PR（开源 CLI 容器，免 license）
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
          dir /repo --verbose --redact
      - name: 内部路径（官方 action，需 GITLEAKS_LICENSE）
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 依赖漏洞（RustSec）+ 许可证合规：原生极速二进制，秒级完成
  cargo-deny:
    name: 依赖检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.85.12
        with:
          tool: cargo-deny
      - name: 检查依赖合规与安全漏洞
        run: cargo deny check --all-features

  # CodeQL 静态安全分析：Rust 无构建扫描已 GA（build-mode: none）。
  # PR 跑默认快速规则；周一定时全量/main 跑深度 security-extended；merge_group 跳过。
  codeql:
    name: CodeQL 分析
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    permissions:
      contents: read
      security-events: write # 上报告到 Security 标签页需要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          languages: rust
          build-mode: none
          queries: ${{ (github.event_name == 'schedule' || github.ref == 'refs/heads/main') && 'security-extended' || '' }}
      - uses: github/codeql-action/analyze@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          category: "/language:rust"
