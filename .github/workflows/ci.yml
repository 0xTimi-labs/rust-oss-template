name: CI

# 测试与安全门禁的编排者：并行调用 checks.yml（测试/构建）与 security.yml（安全），
# CI run 完成即代表全部门禁通过，Review Gate 监听 CI 即可获得原生等待语义。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # 合并队列内再次验证（ruleset 启用了 merge queue，required checks 必须监听此事件）
  merge_group:
  # 定时全量安全扫描：覆盖存量代码 + 用最新检测规则复查历史代码
  schedule:
    - cron: "17 3 * * 1" # 每周一 UTC 03:17

permissions:
  contents: read

# 同一 PR 连续 push 时只保留最新一次运行，
# 中间态被取消则不会触发后续的 AI 审查（防抖）
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 测试与构建门禁：checks.yml 内 bench 需要写权限（gh-pages 基线）
  checks:
    permissions:
      contents: write
    uses: ./.github/workflows/checks.yml

  # 安全门禁：CodeQL 需要 SARIF 上传权限
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    secrets: inherit
