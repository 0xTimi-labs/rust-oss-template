name: Review Gate

# CI 全绿后统一触发 AI 审查：
#   - CodeRabbit：打 review-ready 标签触发（官方 label 选入机制）
#   - Greptile：调 MCP API 直接触发（无需 GitHub 评论）
#   - CI 失败则全部沉默
#
# 注意：
#   - workflow_run 类 workflow 只能从默认分支生效，修改后须同步 main
#   - fork PR 场景 pull_requests 数组可能为空，已做 head SHA 反查兜底

on:
  workflow_run:
    workflows: ["CI"] # 必须与 CI workflow 的 name 完全一致
    types: [completed]

permissions:
  contents: read
  # 注意：给 PR 打标签虽然走 issues 接口，但目标对象是 PR 时
  # 实际要求 pull-requests: write（实测仅有 issues:write 会 403）
  pull-requests: write
  issues: write # 打标签走 issues 接口

concurrency:
  group: review-gate-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# 同一 PR 连续 push 只保留最新一次触发
# 同一 PR 连续 push 只保留最新一次触发
concurrency:
  group: review-gate-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    steps:
      # 标签是状态变更事件而非评论，不存在 bot 评论被过滤的问题，
      # 因此直接用 github.token（权限由本 workflow 的 permissions 声明）即可

      - name: 解析关联 PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # 优先用 workflow_run 自带的 PR 编号；fork PR 场景数组可能为空，
          # 用 head commit 反查兜底，并优先 open 状态的 PR（避免选中已关闭/历史关联）
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            PR_NUMBER=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '([.[] | select(.state == "open")][0] // .[0]).number')
          fi
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "未找到关联 PR（可能是非 PR 提交），跳过"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # CodeRabbit：label 选入是官方确定性通道，不受评论者身份过滤影响；
      # CodeRabbit：label 选入是官方确定性通道，幂等 POST（已存在时不产生新事件，无副作用）
      - name: 触发 CodeRabbit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        if: steps.pr.outputs.found == 'true'
        run: |
          gh api \
            -X POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -F 'labels[]=review-ready'

      # Greptile：MCP API 直调（评论方式会被其过滤 bot 命令）；
      # 与上一步互不阻塞，任一失败不影响另一方
      - name: 触发 Greptile
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        if: always() && steps.pr.outputs.found == 'true'
        run: |
          if [[ -z "$GREPTILE_API_KEY" ]]; then
            echo "GREPTILE_API_KEY 未配置，跳过 Greptile 触发"
            exit 0
          fi
          curl -sf https://api.greptile.com/mcp \
            -H "Authorization: Bearer $GREPTILE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"jsonrpc\": \"2.0\",
              \"id\": 1,
              \"method\": \"tools/call\",
              \"params\": {
                \"name\": \"trigger_code_review\",
                \"arguments\": {
                  \"name\": \"$GITHUB_REPOSITORY_NAME\",
                  \"remote\": \"github\",
                  \"defaultBranch\": \"main\",
                  \"prNumber\": $PR_NUMBER
                }
              }
            }"
