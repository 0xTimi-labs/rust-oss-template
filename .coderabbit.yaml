# CodeRabbit 审查配置：只保留审查意见本体，装饰性内容全部关闭；与默认值一致的项一律不写
# 文档：https://docs.coderabbit.ai/reference/configuration

language: zh-CN # 评论使用中文

reviews:
  # 由 review-gate.yml 在 CI 成功后打 review-ready 标签选入
  # （labels 在 enabled=false 时为正向选入过滤器）；硬门禁由 required checks + 合并队列承担
  auto_review:
    enabled: false
    labels:
      - "review-ready"

  profile: quiet # critical/major 行内发布，其余发现折叠进审查汇总评论
  high_level_summary_in_walkthrough: true # 摘要放进审查汇总评论
  poem: false

  changed_files_summary: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  prompt_for_ai_agents: false

  path_filters:
    - "!web/dist/**" # 构建产物不审
